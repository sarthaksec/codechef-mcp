name: Publish

on:
  push:
    tags: ["v*"]

# id-token: write is what lets npm authenticate via OIDC (trusted publishing).
# No NPM_TOKEN secret is used or needed.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      # Do NOT pass registry-url here. setup-node injects a placeholder
      # NODE_AUTH_TOKEN, which can make npm fall back to token auth and skip
      # the OIDC exchange. npm's default registry is already npmjs.org.
      - name: Check OIDC environment
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" || { echo "OIDC URL missing"; exit 1; }
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" || { echo "OIDC token missing"; exit 1; }
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "NODE_AUTH_TOKEN is set; this can disable trusted publishing"
            exit 1
          fi
          echo "OIDC environment OK"

      - name: Use latest npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Verify tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run offline tests
        run: npm run test:unit

      - name: Check for an existing version
        id: existing
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "codechef-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "codechef-mcp@$VERSION is already on npm; skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # npm detects the GitHub OIDC environment and exchanges it for a
      # short-lived publish token. Provenance is generated automatically
      # for public packages in public repositories.
      - name: Publish
        if: steps.existing.outputs.published != 'true'
        run: |
          unset NODE_AUTH_TOKEN
          npm publish
